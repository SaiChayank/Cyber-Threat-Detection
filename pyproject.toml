[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ps26145-threat-detector"
version = "0.1.0"
description = "AI-Based Detection of Cyber Threats in Unidirectional IP Traffic (NTRO / SIH)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PS26145 Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pip-audit>=2.7.0"
]
research = ["numpy>=1.26.0", "pandas>=2.2.0", "scikit-learn>=1.4.0", "xgboost>=2.0.0", "scapy>=2.5.0", "pyarrow>=25.0.1,<26"]
datasets = ["pyarrow>=25.0.1,<26", "stream-unzip>=0.0.101,<0.1"]
dga-training = ["scikit-learn>=1.4,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
include = ["alerts*", "backend*", "benchmarks*", "datasets*", "detection*", "features*", "ingest*", "ml*", "persistence*", "replay*", "schemas*", "streaming*"]

[tool.setuptools.package-data]
ml = ["artifact.json", "artifact.sha256", "evaluation.json", "dga_v2.json", "dga_v2.sha256"]
